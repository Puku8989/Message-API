<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Message API Dashboard — Send messages to Telegram from a clean, simple interface." />
    <title>Message API — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ── Ambient Background ─────────────────────────────────── -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- ── Main Container ───────────────────────────────────── -->
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.944 0A12 12 0 1 0 24 12.056A12.014 12.014 0 0 0 11.944 0ZM16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472c-.18 1.898-.962 6.502-1.36 8.627c-.168.9-.499 1.201-.82 1.23c-.696.065-1.225-.46-1.9-.902c-1.056-.693-1.653-1.124-2.678-1.8c-1.185-.78-.417-1.21.258-1.91c.177-.184 3.247-2.977 3.307-3.23c.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345c-.48.33-.913.492-1.302.48c-.428-.008-1.252-.241-1.865-.44c-.752-.245-1.349-.374-1.297-.789c.027-.216.325-.437.893-.663c3.498-1.524 5.83-2.529 6.998-3.014c3.332-1.386 4.025-1.627 4.476-1.635Z"/>
                    </svg>
                </div>
                <div>
                    <h1>Message API</h1>
                    <p class="subtitle">Telegram Integration</p>
                </div>
            </div>
            <div class="header-actions">
                <div id="health-badge" class="health-badge offline" title="API Health Status">
                    <span class="health-dot"></span>
                    <span class="health-text">Checking…</span>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar" aria-label="Message statistics">
            <div class="stat-card">
                <div class="stat-icon telegram-accent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 1 0 24 12.056A12.014 12.014 0 0 0 11.944 0ZM16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472c-.18 1.898-.962 6.502-1.36 8.627c-.168.9-.499 1.201-.82 1.23c-.696.065-1.225-.46-1.9-.902c-1.056-.693-1.653-1.124-2.678-1.8c-1.185-.78-.417-1.21.258-1.91c.177-.184 3.247-2.977 3.307-3.23c.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345c-.48.33-.913.492-1.302.48c-.428-.008-1.252-.241-1.865-.44c-.752-.245-1.349-.374-1.297-.789c.027-.216.325-.437.893-.663c3.498-1.524 5.83-2.529 6.998-3.014c3.332-1.386 4.025-1.627 4.476-1.635Z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="telegram-count">0</span>
                    <span class="stat-label">Messages Sent</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success-accent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="success-count">0</span>
                    <span class="stat-label">Delivered</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon error-accent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="failed-count">0</span>
                    <span class="stat-label">Failed</span>
                </div>
            </div>
        </section>

        <!-- Main Content Grid -->
        <main class="main-grid">

            <!-- Message Composer Panel -->
            <section class="panel composer-panel" aria-label="Compose message">
                <div class="panel-header">
                    <h2>Send Message</h2>
                    <span class="panel-badge">Telegram</span>
                </div>

                <form id="message-form" autocomplete="off">
                    <!-- Recipient -->
                    <div class="input-group">
                        <label for="telegram-recipient" class="input-label">
                            Recipient
                            <span class="label-hint">(optional — Chat ID or @username)</span>
                        </label>
                        <div class="input-with-icon">
                            <input
                                type="text"
                                id="telegram-recipient"
                                name="recipient"
                                placeholder="e.g. 123456789 or @username — defaults to .env"
                                autocomplete="off"
                            />
                        </div>
                    </div>

                    <!-- Message Input -->
                    <div class="input-group">
                        <label for="message-input" class="input-label">Message</label>
                        <div class="textarea-wrapper">
                            <textarea
                                id="message-input"
                                name="message"
                                placeholder="Type your message here…"
                                rows="5"
                                maxlength="4096"
                                required
                            ></textarea>
                            <span class="char-counter"><span id="char-count">0</span> / 4096</span>
                        </div>
                    </div>

                    <!-- Send Button -->
                    <button type="submit" class="send-btn" id="send-btn">
                        <span class="send-btn-content">
                            <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            <span id="send-btn-text">Send via Telegram</span>
                        </span>
                        <span class="send-btn-loader" hidden>
                            <svg class="spinner" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
                            Sending…
                        </span>
                    </button>
                </form>
            </section>

            <!-- Message History Panel -->
            <section class="panel history-panel" aria-label="Message history">
                <div class="panel-header">
                    <h2>Recent Activity</h2>
                    <button class="clear-btn" id="clear-history" title="Clear history">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6m5 0V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/></svg>
                    </button>
                </div>
                <div class="history-list" id="history-list">
                    <div class="empty-state" id="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p>No messages yet</p>
                        <span>Send your first message to get started</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Message API v1.0.0 — <a href="/docs" target="_blank" rel="noopener">Swagger Docs</a> · <a href="/redoc" target="_blank" rel="noopener">ReDoc</a></p>
        </footer>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script src="app.js?v=2"></script>
</body>
</html>
